<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}} — playtest</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0a0c; overflow: hidden; }
      #unity-container { position: fixed; inset: 0; width: 100%; height: 100%; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #0a0a0c; }

      /* Click-to-play gesture gate. Browsers refuse pointer lock without a user gesture, and this is a
         mouse-look FPS, so the game never even starts loading input until the player clicks — that click
         is also the gesture the canvas uses to request pointer lock on its own first click handler. */
      #unity-gate {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; background: rgba(6, 6, 8, 0.92); color: #d8d3c4;
        font-family: Georgia, 'Times New Roman', serif; text-align: center; cursor: pointer; z-index: 10;
        letter-spacing: 0.04em;
      }
      #unity-gate h1 { font-size: 1.6rem; font-weight: normal; margin: 0; color: #c9a24b; }
      #unity-gate p { font-size: 0.95rem; margin: 0; opacity: 0.8; max-width: 32rem; }
      #unity-progress { width: 26rem; max-width: 80vw; height: 4px; background: #2a2a2e; margin-top: 8px; }
      #unity-progress-bar { width: 0%; height: 100%; background: #c9a24b; transition: width 0.2s linear; }
      #unity-gate.hidden { display: none; }
      #unity-warning { position: fixed; top: 0; left: 0; right: 0; z-index: 20; color: #f2c14e;
        background: rgba(20, 20, 20, 0.85); font-family: sans-serif; font-size: 0.85rem; }
      #unity-warning div { padding: 6px 10px; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="unity-warning"></div>
    <div id="unity-gate">
      <h1>{{{ PRODUCT_NAME }}}</h1>
      <p id="unity-gate-text">Click to load — mouse look needs pointer lock, which the browser only grants after a click.</p>
      <div id="unity-progress"><div id="unity-progress-bar"></div></div>
    </div>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var gate = document.querySelector("#unity-gate");
      var gateText = document.querySelector("#unity-gate-text");
      var progressBar = document.querySelector("#unity-progress-bar");
      var warningBanner = document.querySelector("#unity-warning");
      var unityInstance = null;
      var loading = false;

      function showBanner(msg, type) {
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === 'error') div.style.color = '#ff7b72';
      }

      function startLoad() {
        if (loading || unityInstance) return;
        loading = true;
        gateText.textContent = "Loading…";

        createUnityInstance(canvas, {
          arguments: [],
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          showBanner: showBanner,
        }, function (progress) {
          progressBar.style.width = (progress * 100) + "%";
        }).then(function (instance) {
          unityInstance = instance;
          gate.classList.add("hidden");
          canvas.focus();
          // The same click that satisfied the load gesture also requests pointer lock. Any later click on
          // the canvas re-requests it, since losing focus (Esc, alt-tab) releases the lock.
          canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
          canvas.requestPointerLock();
        }).catch(function (message) {
          loading = false;
          gateText.textContent = "Failed to load: " + message;
        });
      }

      canvas.addEventListener("click", function () {
        if (!unityInstance) return;
        canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
        canvas.requestPointerLock();
      });

      gate.addEventListener("click", startLoad);
    </script>
  </body>
</html>
